:root{--buff:var(--ok);--debuff:var(--bad)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
[hidden]{display:none!important}
#gameRoot{height:auto!important;min-height:100vh}
#gameRoot .game{height:auto!important;min-height:100vh}
#gameRoot .col{overflow:visible!important}
#gameRoot .view{overflow:visible!important}
#gameRoot .chat{min-height:380px}
#gameRoot .clock{flex-direction:column;align-items:stretch;gap:6px}
#gameRoot .ckrow{display:flex;justify-content:space-between;align-items:center}
#gameRoot .ckbtn{display:flex;justify-content:space-between}
#gameRoot .who{cursor:pointer}
#gameRoot .sh{margin:12px 0 6px;font-size:12px;color:var(--dim);font-weight:600}
#gameRoot .srow2{display:flex;gap:6px}
#gameRoot .swap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gameRoot .sc{background:var(--panel2);border-radius:4px;padding:10px}
#gameRoot .sc h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600}
#gameRoot .up{color:var(--buff);font-weight:700}
#gameRoot .dn{color:var(--debuff);font-weight:700}
#gameRoot .topbar{display:flex;justify-content:space-between;align-items:center;max-width:1700px;margin:0 auto;padding:6px 10px 0;box-sizing:border-box;height:28px}
#gameRoot .tbr{display:flex;align-items:center;gap:12px}
#gameRoot #ck{font-weight:700}
#gameRoot #cd{color:var(--dim);font-size:13px}
#gameRoot .gear{background:none;border:0;color:var(--text);cursor:pointer;padding:2px;line-height:0}
#gameRoot .game{min-height:calc(100vh - 34px)!important}
#gameRoot .prof{margin:5px;gap:3px}
#gameRoot .info{display:flex;flex-direction:column}
#gameRoot .info .name{margin-bottom:3px}
#gameRoot .info .row+.row{margin-top:2px}
#gameRoot .eq{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#gameRoot .eqr{background:var(--panel2);border-radius:4px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;font-size:13px}
#gameRoot .eqr .dim{font-size:11px}
#gameRoot .irow{border-bottom:1px solid var(--line);padding:6px 2px}
#gameRoot .ihead{cursor:pointer;font-weight:600}
#gameRoot .ibtn{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
#gameRoot .sm2{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:3px;padding:2px 8px;font-size:12px;cursor:pointer}
#gameRoot .btn.sm2{background:var(--accent);color:#fff;border:0}
#gameRoot .btn.alt.sm2{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
#gameRoot .sm2:disabled{opacity:.45;cursor:not-allowed}
#gameRoot .bd{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:0 5px;margin-left:4px}
#gameRoot .rcp{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:4px}
#gameRoot .rt{display:flex;align-items:center;gap:6px;margin:4px 0}
#gameRoot .ic{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:0 2px}
#gameRoot .rr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px}
#gameRoot .rr.hi{border-color:var(--accent);background:var(--panel2)}
#gameRoot #pb input{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:4px;font:inherit}
#gameRoot #pb p{margin:0 0 8px}
#gameRoot #ride hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#gameRoot .btn.bad{background:var(--bad)}
#app input[type=password]{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:4px}
.cropm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.cropb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--text)}
.cropc{width:280px;height:280px;border:2px solid var(--accent);border-radius:6px;touch-action:none;cursor:grab;display:block;margin:8px auto}
.cropr{width:280px;margin-top:8px}
.cropb button{padding:8px 18px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit}
.cropb button[data-x="ok"]{background:var(--accent);color:#fff;border:0}
#app .phbox{width:96px;height:96px;margin:0 auto 6px;border-radius:6px;border:1px solid var(--line);background-position:center;background-size:cover;background-repeat:no-repeat}
#app .warn{margin-top:4px;font-size:12px;color:var(--bad)}
#app .stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
#app .srow{display:flex;align-items:center;gap:6px;padding:2px 0}
#app .srow span{flex:1}#app .srow b{width:22px;text-align:center}
#app .srow .pill{padding:0 9px;line-height:24px}
#app .pvs{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;font-size:12px}
#app h1.brand{font-family:"Cormorant Garamond","Noto Serif KR","Nanum Myeongjo",Georgia,"Times New Roman",serif;font-size:56px;font-weight:700;letter-spacing:.06em;margin:0 0 6px;line-height:1.1}
#authRoot .themebtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
#gameRoot{height:100vh}
@media (max-width:1000px){#gameRoot{height:auto}}
</style>
</head>
<body>
<div class="wrap" id="authRoot"><button class="themebtn">다크 모드</button><div id="app" style="width:100%;display:flex;justify-content:center"></div></div>
<div id="gameRoot" hidden>

<div class="game">
<div class="col">
 <div class="box">
  <div class="prof">
   <div class="avatar" id="avatar" title="클릭해서 프로필 사진 변경">사진<br>(클릭)</div>
   <div class="info">
    <div class="name" id="name"></div>
    <div class="row">출신지 <b id="origin"></b></div>
    <div class="row">생존 <b class="day" id="day"></b></div>
    <div class="row">직업 <b id="job"></b></div>
    <div class="row">인벤토리 <b id="bag"></b></div>
    <div class="row">소지금 <b id="gold"></b></div>

 $("mvt").innerHTML=`‘${mv.label}’(으)로 이동합니다.`+(mv.n>1?`<br><small>${mv.n}칸 이동 · 경유 : ${mv.via.join(" → ")} (시간 합산)</small>`:"");
 $("mvm").innerHTML=mv.modes.map(m=>`<button class="mode" aria-pressed="${m===mv.mode}" data-m="${m}">${MODE[m]}</button>`).join("");
 $("mvi").innerHTML=`소요시간 : ${q.min}분 (${MODE[mv.mode]})<br>소모 재료 : ${mat}`+(ok?"":`<br><span style="color:var(--debuff)">재료가 부족합니다.</span>`);
 $("mvgo").disabled=!ok}
$("mvm").onclick=e=>{const b=e.target.closest(".mode");if(b){mv.mode=b.dataset.m;drawMove()}};
$("mvno").onclick=()=>$("mvmodal").hidden=true;
const consume=(n,c)=>{for(let i=0;i<c;i++)me.inv.splice(me.inv.findIndex(x=>nm(x)===n),1)};
$("mvgo").onclick=()=>{const q=quote(mv.kind,mv.n,mv.mode);if(count("먹이")<q.food||count("마력석")<q.stone)return;
 consume("먹이",q.food);consume("마력석",q.stone);
 me.travel={end:Date.now()+q.min*60000,dest:mv.dest,label:mv.label};$("mvmodal").hidden=true;bag();renderAll()};
function arrive(){sfx("ok");const d=me.travel.dest;me.travel=null;me.cont=d.cont;me.area=d.area;me.sub=d.sub;view.area=d.area==="cap"?null:d.area;view.sel=d.area==="cap"?"cap":d.sub;renderAll()}
T(()=>{if(me.travel){Date.now()>=me.travel.end?arrive():renderAll()}},1000);
$("skip").onclick=()=>{if(me.travel)arrive()};

// ---- 지도 ----
function stage(){const w=W(),d=!!view.area,a=d?AR(view.area):null;
 const nodes=d?a.nodes:[w.cap,...w.areas],edges=d?a.edges:w.edges;
 const P=id=>nodes.find(n=>n.id===id);
 const here=me.travel?null:(d?(me.area===view.area?me.sub:null):me.area);
 $("stage").innerHTML=`<img src="${d?DAE:MAPS[me.cont]}" alt="" onerror="this.remove()"><svg viewBox="0 0 100 55" preserveAspectRatio="xMidYMid meet">`+
  edges.map(([x,y])=>`<line class="ed" x1="${P(x).x}" y1="${P(x).y}" x2="${P(y).x}" y2="${P(y).y}"/>`).join("")+
  nodes.map(n=>`<g class="nd ${n.hub?"hub":""} ${n.id===here?"cur":""} ${n.id===view.sel?"sel":""}" data-id="${n.id}"><circle cx="${n.x}" cy="${n.y}" r="2"/><text x="${n.x}" y="${n.y+4.7}">${n.name}</text>${!d&&n.diff?`<text class="df" x="${n.x}" y="${n.y+6.9}">★${n.diff}</text>`:""}</g>`).join("")+`</svg>`;
 $("back").hidden=!d;$("maptitle").textContent=me.cont+" 지도"+(d?" › "+a.name:"");$("mapsub").textContent="현재 위치: "+locText()}
function desc(){const w=W(),d=!!view.area,a=d?AR(view.area):AR(view.sel||me.area);
 let h=`<h3>${a.name}<small>${a.tag||""}</small></h3><p>${a.desc}</p>`,acts="";
 if(a.id==="cap"&&a.diff)h+=`<p>조사 난이도 : ${"★".repeat(a.diff)}</p>`;
 const mb=(k,id,l)=>{const p=plan(k,id);return p?`<button class="btn" data-m="${k}" data-id="${id}">${l}(으)로 이동${p.n>1?` · ${p.n}칸`:""}</button>`:""};
 acts+=mb("area",a.id,a.name);if(!d&&a.id===me.area&&a.id!=="cap")acts+=`<button class="btn alt" data-m="enter">소지역 지도 보기</button>`;
 if(d&&view.sel){const s=a.nodes.find(n=>n.id===view.sel);
  h+=`<p class="sub"><b>${s.name}${s.hub?" (거점)":""}</b> — ${s.desc}${s.star?`<br>조사 난이도 : ${"★".repeat(s.star)}`:""}</p>`;
  if(me.area===a.id)acts+=mb("sub",s.id,s.name)}
 if(!acts&&!me.travel&&!(a.id===me.area&&!view.sel))h+=`<p class="dim">인접한 지역으로만 이동할 수 있어요. 말을 타면 이어진 길을 따라 한 번에 갈 수 있어요.</p>`;
 $("desc").innerHTML=h+(acts?`<div class="acts">${acts}</div>`:"");
 $("explore").disabled=!!me.travel;
 $("explore").closest(".explore").hidden=me.area==="cap";
 const cp=me.area==="cap";$("market").hidden=!(cp&&me.cont==="카르도르");$("emarket").hidden=$("smithy").hidden=!(cp&&me.cont==="엘리시아");$("clinic").hidden=!(cp&&me.cont==="솔레니아");
 const s=curSub(),g=w.gate;$("cont").hidden=!(g&&me.area===g.id&&s&&s.hub&&!me.travel);
 if($("csel").dataset.c!==me.cont){$("csel").dataset.c=me.cont;$("csel").innerHTML=Object.keys(WORLD).filter(k=>k!==me.cont&&WORLD[k].gate).map(k=>`<option>${k}</option>`).join("")}}
function renderAll(){stage();desc();groundRender();$("loc").textContent=locText();
 const b=$("banner");b.hidden=!me.travel;
 if(me.travel){const s=Math.max(0,Math.ceil((me.travel.end-Date.now())/1000));$("btxt").textContent=`${me.travel.label}(으)로 이동 중… ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}}
$("stage").onclick=e=>{const g=e.target.closest(".nd");if(!g)return;const id=g.dataset.id;
 if(!view.area){if(id===me.area&&id!=="cap"){view.area=id;view.sel=me.sub}else view.sel=id}else view.sel=id;renderAll()};
$("back").onclick=()=>{view.sel=view.area;view.area=null;renderAll()};
$("desc").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;if(b.dataset.m==="enter"){view.area=me.area;view.sel=me.sub;renderAll();return}const p=plan(b.dataset.m,b.dataset.id);if(p)openMove(p)};
$("cgo").onclick=()=>{const to=$("csel").value,g=WORLD[to].gate;if(!to)return;
 openMove({kind:"cont",n:1,label:`${to} · ${g.name}`,dest:{cont:to,area:g.id,sub:g.nodes.find(n=>n.hub).id},modes:["walk",...(hasV("말")?["horse"]:[]),...(hasV("비행선")?["air"]:[])]})};
$("dev").innerHTML="테스트용 순간이동: ";$("dev").hidden=!opts.admin;
$("dev").insertAdjacentHTML("beforeend",Object.keys(WORLD).map(r=>`<button data-r="${r}">${r}</button>`).join(" "));
$("dev").onclick=e=>{const b=e.target.closest("button");if(!b)return;me.cont=b.dataset.r;me.area="cap";me.sub=null;me.travel=null;view.area=null;view.sel="cap";renderAll()};

// ---- 탐사 ----
const ITEMS=["통조림","생수","붕대","낡은 천","고철","마력 전지","건전지","라이터","항생제","철사","빈 탄약통","마른 빵","먹이"];
const MOBS=["굶주린 들개","잔해 속 그림자","붉은눈 쥐떼","녹슨 자동인형"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function modal(t,b){$("mt").textContent=t;$("mb").textContent=b;$("modal").hidden=false}
$("mok").onclick=()=>$("modal").hidden=true;
$("explore").onclick=()=>{const r=Math.random();
 if(r<.6){const it=pick(ITEMS);
  if(!canAdd(it))modal("가방이 가득 찼다",`${it}을(를) 발견했지만 가져갈 수 없다.`);
  else{addItem(it);modal("아이템 획득",`${it}을(를) 얻었다.`)}}
 else if(r<.85)modal("몬스터 조우",`${pick(MOBS)}와(과) 마주쳤다! (전투는 준비 중)`);
 else modal("아무것도 없음","주변을 샅샅이 뒤졌지만 쓸 만한 것은 없다.");
 bag()};

// ---- 탭 / 명단 / 채팅 ----
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t===b));
 ["map","inv","stat"].forEach(k=>$("v-"+k).hidden=k!==b.dataset.t)};
const people=[{n:me.name,s:"나"},{n:"박서진",s:"생존 5일"},{n:"Raven",s:"생존 31일"}];
$("rcnt").textContent=people.length+"명";
$("roster").innerHTML=people.map(p=>`<div class="ch"><span class="dot"></span>${p.n}<small>${p.s}</small></div>`).join("");
const chats={local:[{u:"박서진",t:"이 근처에 물 있는 곳 알아?"},{u:"Raven",t:"북쪽 약국 뒤편에 있었어."}],world:[{u:"김하늘",t:"동쪽 다리 감염자 많으니 조심하세요"},{u:"Raven",t:"교환할 사람 구함 (통조림↔붕대)"}],notice:[{u:"관리자",t:"서버 점검: 오늘 새벽 4시 ~ 5시"}]};
let cur="local";
function render(){
 $("log").innerHTML=chats[cur].filter(m=>cur==="notice"||!me.blocked.includes(m.u)).map(m=>`<div class="msg ${cur==="notice"?"notice":""}"><b class="who" data-u="${esc(m.u)}">${esc(m.u)}</b>${m.t.replace(/</g,"&lt;")}</div>`).join("");
 $("log").scrollTop=1e9;
 const lock=cur==="notice"&&!me.isAdmin;$("inp").disabled=lock;$("btn").disabled=lock;
 $("inp").placeholder=lock?"공지는 관리자만 작성할 수 있어요":"메시지 입력…"}
$("log").onclick=e=>{const b=e.target.closest(".who");if(!b||cur==="notice")return;const u=b.dataset.u;if(u===me.name)return;
 pop("계정 차단",`<p><b>${esc(u)}</b> 님을 차단하시겠습니까?</p><p class="dim">차단하면 이 계정의 채팅이 보이지 않아요. 설정에서 해제할 수 있어요.</p>`,[{t:"차단",c:"bad",fn:()=>{if(!me.blocked.includes(u))me.blocked.push(u);render()}},{t:"취소"}])};
$("ctabs").onclick=e=>{const b=e.target.closest(".ctab");if(!b)return;cur=b.dataset.c;
 document.querySelectorAll(".ctab").forEach(t=>t.setAttribute("aria-selected",t===b));render()};
function send(){const v=$("inp").value.trim();if(!v||$("inp").disabled)return;chats[cur].push({u:me.name,t:v});$("inp").value="";render()}
$("btn").onclick=send;$("inp").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)send()};

// ---- 시간 / 시장 (한국 표준시 기준) ----
const KST=o=>new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",...o});
const hourNow=()=>+new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour:"numeric",hourCycle:"h23"}).format(new Date());
const isOpen=()=>{const h=hourNow();return h>=9&&h<21};
const mOpen=()=>hourNow()>=12;
const eOpen=()=>Math.floor((Date.now()+9*36e5)/864e5)%2===0&&isOpen();
function clock(){const n=new Date();
 $("ck").textContent=KST({hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true}).format(n);
 $("cd").textContent=KST({month:"long",day:"numeric",weekday:"short"}).format(n);
 const tv=!!me.travel,eo=eOpen(),es=eo?" · 오늘 열림":" · 오늘은 쉬는 날";
 $("trade").disabled=tv||!mOpen();$("mstat").textContent=mOpen()?" · 영업 중":" · 영업 종료";
 ["etrade","strade","srepair","cure"].forEach(i=>$(i).disabled=tv||!eo);["emstat","smstat","clstat"].forEach(i=>$(i).textContent=es)}
T(clock,1000);
const SMITH=[["철검",60],["단궁",45],["가죽 갑옷",50],["철제 방패",55]],isEq=n=>SMITH.some(x=>x[0]===n);
const GOODS=[["통조림",12],["생수",8],["붕대",15],["건전지",10],["고철",5],["마력 전지",30],["먹이",6],["마력석",40]];
const today=()=>new Intl.DateTimeFormat("sv",{timeZone:"Asia/Seoul"}).format(new Date());
const price=(n,b)=>{let h=0;for(const c of today()+n)h=(h*31+c.charCodeAt(0))>>>0;return Math.max(1,Math.round(b*(0.8+(h%41)/100)))};
let curGoods=GOODS;
const tmsg=t=>$("tmsg").textContent=t;
function tradeRender(){
 $("tg").textContent=me.gold+" G";
 $("tl").innerHTML=curGoods.map(([n,b])=>{const p=price(n,b),own=count(n);
  return `<div class="tr"><span>${n}<small>보유 ${own}</small></span><b>${p} G</b><button class="btn" data-a="buy" data-n="${n}" data-p="${p}">산다</button><button class="btn alt" data-a="sell" data-n="${n}" data-p="${p}" ${own?"":"disabled"}>판다</button></div>`}).join("")}
function openTrade(t,g){curGoods=g;$("ttitle").textContent=t;tradeRender();tmsg("");$("tmodal").hidden=false}
$("trade").onclick=()=>openTrade("시장 거래",GOODS);
$("etrade").onclick=()=>openTrade("시장 거래",GOODS);
$("strade").onclick=()=>openTrade("대장간 거래",SMITH);
$("tclose").onclick=()=>$("tmodal").hidden=true;
$("tl").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const n=b.dataset.n,p=+b.dataset.p;
 if(b.dataset.a==="buy"){if(!canAdd(isEq(n)?{n}:n))tmsg("가방이 가득 찼다.");else if(me.gold<p)tmsg("돈이 부족하다.");else{me.gold-=p;addItem(isEq(n)?{n,dur:10,max:10}:n);tmsg(n+" 구입")}}
 else{const i=me.inv.findIndex(x=>nm(x)===n);if(i>=0){me.inv.splice(i,1);me.gold+=p;tmsg(n+" 판매")}}
 bag();tradeRender()};
// ---- 대장간 수리 / 진료소 ----
let rlist=[];
const rcost=x=>(x.max-x.dur)*2;
function repairRender(){rlist=[...Object.values(me.equipped).filter(x=>x&&typeof x==="object").map(x=>[x,"착용 중"]),...me.inv.filter(x=>typeof x==="object").map(x=>[x,"소지품"])];
 $("rg").textContent=me.gold+" G";
 $("rl").innerHTML=rlist.length?rlist.map(([x,w],i)=>`<div class="tr" style="grid-template-columns:1fr auto auto"><span>${x.n}<small>${w} · 내구도 ${x.dur}/${x.max}</small></span><b>${rcost(x)} G</b><button class="btn" data-i="${i}" ${x.dur>=x.max?"disabled":""}>수리</button></div>`).join(""):"<p class='dim'>수리할 장비가 없다.</p>"}
$("srepair").onclick=()=>{repairRender();$("rmsg").textContent="";$("rmodal").hidden=false};
$("rclose").onclick=()=>$("rmodal").hidden=true;
$("rl").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const x=rlist[+b.dataset.i][0],c=rcost(x);
 if(me.gold<c){$("rmsg").textContent="돈이 부족하다.";return}
 me.gold-=c;x.dur=x.max;$("rmsg").textContent=x.n+" 수리 완료";bag();repairRender()};
$("cure").onclick=()=>{const d=me.fx.filter(f=>f.t==="debuff");
 $("cl").innerHTML=d.length?d.map((f,i)=>`<button class="mode" data-i="${i}">${f.n}</button>`).join(""):"<p class='dim'>치료할 상태이상이 없다.</p>";$("cmodal").hidden=false};
$("cclose").onclick=()=>$("cmodal").hidden=true;
$("cl").onclick=e=>{const b=e.target.closest("button");if(!b)return;const f=me.fx.filter(f=>f.t==="debuff")[+b.dataset.i];
 me.fx.splice(me.fx.indexOf(f),1);fxRender();$("cmodal").hidden=true;modal("치료 완료",`‘${f.n}’ 상태이상이 사라졌다.`)};
const snap=()=>({cont:me.cont,area:me.area,sub:me.sub,gold:me.gold,items:me.inv,equipped:me.equipped,vehicles:me.vehicles,pet:me.pet,ground:me.ground,blocked:me.blocked,fx:me.fx,hp:me.hp,mp:me.mp,hunger:me.hunger,travel:me.travel});
let last=JSON.stringify(snap());
T(()=>{const j=JSON.stringify(snap());if(j!==last){last=j;opts.save(cp(snap()))}},3000);
$("exitGame").onclick=()=>opts.exit(cp(snap()));
{const st=char.stats||STATS.map(()=>5);$("v-stat").innerHTML=`<h2>특성</h2><div class="desc"><b>${esc(char.trait||"없음")}</b></div><h2 style="margin-top:14px">스탯</h2><div class="desc">${radar(st,240)}</div>`}
render();bag();renderAll();clock();
return{stop(){_ids.forEach(clearInterval);document.removeEventListener("click",tickH)}};


}

</script>
</body>
</html>
